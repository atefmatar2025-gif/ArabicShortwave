name: Update Arabic schedule

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download EiBi schedule and keep Arabic entries
        run: |
          set -e
          codes=$(python3 - <<'PY'
          import datetime as d
          t = d.datetime.now(d.UTC).date()
          def last_sun(y, m):
              x = d.date(y, m, 31)
              return x - d.timedelta(days=(x.weekday() + 1) % 7)
          y = t.year; yy = y % 100
          if t >= last_sun(y, 10): c = [f"b{yy:02d}", f"a{yy:02d}"]
          elif t >= last_sun(y, 3): c = [f"a{yy:02d}", f"b{(yy-1)%100:02d}"]
          else: c = [f"b{(yy-1)%100:02d}", f"a{(yy-1)%100:02d}"]
          print(" ".join(c))
          PY
          )
          echo "::warning::Season candidates: $codes"
          ok=""
          for c in $codes; do
            for base in http://www.eibispace.de/dx https://www.eibispace.de/dx; do
              # public read-only schedule file; the site's certificate chain is outdated
              code=$(curl -sSL -k --retry 2 -A "Mozilla/5.0" -o raw.csv -w '%{http_code}' "$base/sked-$c.csv" 2>curl.err || true)
              echo "::warning::$base/sked-$c.csv -> HTTP $code $(head -c 200 curl.err)"
              if [ "$code" = "200" ]; then
                n=$(awk -F';' '$6 ~ /(^|[,\/ ])A([,\/ ]|$)/' raw.csv | wc -l)
                echo "::warning::$base/sked-$c.csv -> $n Arabic lines, $(wc -c < raw.csv) bytes, first: $(head -c 120 raw.csv | tr -d '\r\n')"
                if [ "$n" -ge 10 ]; then ok="$c"; break 2; fi
              fi
            done
          done
          [ -n "$ok" ] || { echo "No schedule found"; exit 1; }
          { echo "# source=EiBi sked-$ok"; awk -F';' '$6 ~ /(^|[,\/ ])A([,\/ ]|$)/' raw.csv; } > data/arabic.csv
          rm raw.csv
          wc -l data/arabic.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arabic.csv
          git diff --cached --quiet || { git commit -m "Update Arabic schedule"; git push; }
